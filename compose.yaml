name: gline

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gline
      POSTGRES_USER: gline
      POSTGRES_PASSWORD: ${GLINE_POSTGRES_PASSWORD:?set GLINE_POSTGRES_PASSWORD in .env}
    volumes:
      - gline-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${GLINE_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gline -d gline"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      GLINE_HTTP_ADDR: :8080
      GLINE_DATABASE_URL: postgres://gline:${GLINE_POSTGRES_PASSWORD}@postgres:5432/gline?sslmode=disable
      GLINE_BOOTSTRAP_TOKEN: ${GLINE_BOOTSTRAP_TOKEN:?set GLINE_BOOTSTRAP_TOKEN in .env}
      GLINE_API_KEY_PEPPER: ${GLINE_API_KEY_PEPPER:?set GLINE_API_KEY_PEPPER in .env}
      GLINE_ALLOWED_ORIGINS: http://localhost:${GLINE_WEB_PORT:-4173}
      GLINE_QUERY_CONCURRENCY: ${GLINE_QUERY_CONCURRENCY:-8}
      GLINE_QUERY_TIMEOUT: ${GLINE_QUERY_TIMEOUT:-10s}
      GLINE_MAINTENANCE_INTERVAL: ${GLINE_MAINTENANCE_INTERVAL:-1m}
      GLINE_AGENT_STALE_AFTER: ${GLINE_AGENT_STALE_AFTER:-2m}
      GLINE_RETENTION_BATCH_SIZE: ${GLINE_RETENTION_BATCH_SIZE:-1000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GLINE_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: web
      dockerfile: Dockerfile
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GLINE_WEB_PORT:-4173}:8080"
    restart: unless-stopped

volumes:
  gline-postgres:

version: 1

agent:
  # Replace this with the Agent ID created in the Gline console.
  id: 22222222-2222-4222-8222-222222222222
  version: dev
  # Loopback-only Prometheus endpoint: /metrics and /livez.
  metrics_addr: 127.0.0.1:9109
  log:
    level: info
    file: ./data/agent.log

pipelines:
  - # Replace this with the Pipeline ID created in the Gline console.
    id: 33333333-3333-4333-8333-333333333333
    # Must match the Pipeline config_version shown by the Server.
    config_version: 1
    service: demo-api
    host: local-dev
    source:
      type: file
      params:
        path: ./data/demo-api.log
        # Stable key used to persist the file identity and byte offset.
        source_key: demo-api-log
    parser:
      type: string_line
      params: {}

sender:
  type: reliable
  params:
    spool_path: ./data/agent.wal
    max_spool_bytes: 268435456
    max_record_bytes: 8388608
    batch_size: 200
    flush_interval: 2s
    heartbeat_interval: 30s
    retry:
      base_delay: 500ms
      max_delay: 30s
      jitter: 0.2
  destination:
    type: gline
    params:
      url: http://127.0.0.1:8080/api/v1/batches
      # The key needs both ingest and agent:write scopes. Do not commit a real key.
      token: replace-with-agent-api-key
